<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨語 Ink Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=LXGW+WenKai+TC&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f2ebdb; --ink:#231f1b; --ink-soft:#6b6257; --line:rgba(35,31,27,.24); --seal:#b23a2e; --glass:rgba(244,238,224,.72)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--paper); color:var(--ink); font-family:"Cormorant Garamond","LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","Songti TC",Georgia,serif; font-size:18px; -webkit-tap-highlight-color:transparent}
  #app{position:fixed; inset:0; background:var(--paper); overflow:hidden}
  #stage{position:absolute; inset:0; touch-action:none; cursor:crosshair}
  #stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #flash{position:absolute; inset:0; background:#fffdf4; opacity:0; pointer-events:none}
  #hint{position:absolute; left:0; right:0; top:38%; text-align:center; padding:0 24px; color:var(--ink-soft); font-size:clamp(19px,2.4vw,30px); line-height:1.5; pointer-events:none; transition:opacity .8s}
  #hint.off{opacity:0}
  #pin{position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; border:1.5px solid var(--seal); pointer-events:none; opacity:0; transition:opacity .25s}
  #pin.on{opacity:.85}
  .top{position:absolute; top:12px; left:14px; right:14px; display:flex; align-items:center; gap:10px; pointer-events:none}
  .top>*{pointer-events:auto}
  .mark{border:0; padding:0; cursor:pointer; font-family:"Ma Shan Zheng","Kaiti SC",STKaiti,serif; font-size:24px; line-height:1; background:var(--seal); color:var(--paper); width:38px; height:38px; border-radius:5px; display:grid; place-items:center; flex:none}
  h1{font-size:23px; font-weight:600; margin:0; letter-spacing:.12em; flex:1; white-space:nowrap; pointer-events:none}
  .ghost{white-space:nowrap; font:inherit; font-size:16px; color:var(--ink); background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:6px 14px; min-height:40px; cursor:pointer}
  .ghost:active{background:rgba(35,31,27,.12)}
  .ghost:disabled{opacity:.4; cursor:default}
  .bottom{position:absolute; left:0; right:0; bottom:10px; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none}
  .bottom.typing{bottom:auto; top:60px}
  .bottom>*{pointer-events:auto}
  form{display:flex; gap:8px; width:min(440px,calc(100% - 28px))}
  input{flex:1; min-width:0; font:inherit; font-size:19px; color:var(--ink); background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:9px 18px; outline:none}
  input::placeholder{color:var(--ink-soft)}
  input:focus{border-color:var(--ink)}
  .paint{font:inherit; font-weight:600; font-size:18px; color:var(--paper); background:var(--ink); border:0; border-radius:999px; padding:0 22px; min-height:44px; cursor:pointer}
  .paint:active{transform:translateY(1px)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--seal); outline-offset:2px}
  .chips{display:flex; gap:4px; max-width:100%; overflow-x:auto; padding:2px 12px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:46px; padding:5px 4px 4px; font:inherit; color:var(--ink); background:var(--glass); border:1px solid var(--line); border-radius:10px; cursor:pointer}
  .chip b{font-family:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",STKaiti,serif; font-weight:400; font-size:24px; line-height:1.05}
  .chip i{font-size:12px; color:var(--ink-soft); line-height:1.1}
  .chip:active{border-color:var(--seal); color:var(--seal)}
  #aibadge{font-size:13px; letter-spacing:.04em; font-weight:500; color:var(--seal); border:1px solid var(--seal); border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:middle}
  #panel{position:absolute; top:60px; left:14px; width:min(300px,calc(100% - 28px)); background:#f6f0e2; border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:0 8px 28px rgba(60,45,20,.22); font-size:17px}
  #panel p{margin:6px 0 8px; color:var(--ink-soft); font-size:15px; line-height:1.4}
  #panel label{display:block; padding:7px 0; cursor:pointer}
  #panel input{flex:none; width:18px; height:18px; padding:0; margin:0 4px 0 0; vertical-align:-3px; accent-color:var(--seal)}
  #panel .last{color:var(--ink); border-top:1px solid var(--line); padding-top:8px; margin-top:8px}
  #panel .row{display:flex; gap:8px; margin-top:8px}
  #toast{position:absolute; left:50%; top:64px; transform:translateX(-50%); max-width:calc(100% - 28px); background:var(--ink); color:var(--paper); font-size:16px; padding:8px 16px; border-radius:999px; opacity:0; transition:opacity .3s; pointer-events:none; text-align:center}
  #toast.on{opacity:.94}
  @media (max-width:520px){h1{font-size:18px}.ghost{padding:6px 11px;font-size:15px}#full{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="paper" aria-hidden="true"></canvas>
    <canvas id="fluid" aria-hidden="true"></canvas>
    <canvas id="ink" role="img" aria-label="水墨畫布"></canvas>
    <div id="flash"></div>
    <div id="hint">輸入一個字，或點選下方的字，墨就會化成它。<br>在紙上拖動手指，可以攪動墨水。</div>
    <div id="pin"></div>
  </div>
  <div class="top">
    <button class="mark" id="mark" type="button" aria-label="連按三下開啟 AI 作畫設定">墨</button>
    <h1>墨語 <span id="aibadge" hidden>AI 作畫</span></h1>
    <button class="ghost" id="full" type="button">全螢幕</button>
    <button class="ghost" id="undo" type="button" disabled>復原</button>
    <button class="ghost" id="clear" type="button" disabled>清空</button>
  </div>
  <div id="panel" hidden></div>
  <div id="toast" role="status"></div>
  <div class="bottom" id="bottom">
    <form id="f" autocomplete="off">
      <input id="q" type="text" inputmode="text" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="輸入一個字… 竹、zhu、bamboo" aria-label="要畫的字">
      <button class="paint" type="submit">落墨</button>
    </form>
    <div class="chips" id="chips" aria-label="墨認識的字"></div>
  </div>
</div>
<script>
(function(){
'use strict';
var INK='27,25,21', RED='178,52,40', PLUM='186,48,58', KOI='204,84,36', PINK='208,96,112', SNOW='255,253,246';
var PI=Math.PI, TAU=PI*2;

/* ---------- seeded random ---------- */
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- geometry helpers ---------- */
function qb(a,b,c,n){var o=[];for(var i=0;i<=n;i++){var t=i/n,u=1-t;o.push([u*u*a[0]+2*u*t*b[0]+t*t*c[0],u*u*a[1]+2*u*t*b[1]+t*t*c[1]])}return o}
function chaikin(p,it){for(var k=0;k<it;k++){var o=[p[0]];for(var i=0;i<p.length-1;i++){var a=p[i],b=p[i+1];o.push([a[0]*.75+b[0]*.25,a[1]*.75+b[1]*.25],[a[0]*.25+b[0]*.75,a[1]*.25+b[1]*.75])}o.push(p[p.length-1]);p=o}return p}

/* ---------- the brush: a row of bristles dragged along a path ---------- */
function stroke(P,pts,wf,o){
  o=o||{};var a=o.a==null?.7:o.a,c=o.c||INK,dry=o.dry||0,edge=o.edge||0,rnd=rng((P.rnd()*4294967296)|0);
  var L=[0],i;for(i=1;i<pts.length;i++)L[i]=L[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);
  var tot=L[L.length-1];if(!(tot>.5))return;
  var wmax=0;for(i=0;i<=10;i++)wmax=Math.max(wmax,wf(i/10));
  var nb=Math.max(1,Math.round(wmax/1.7)),br=[];
  for(i=0;i<nb;i++){var u=nb===1?0:(i/(nb-1)-.5)+(rnd()-.5)*.5/nb;br.push({u:u,ink:(.55+rnd()*.45)*(1+edge*(Math.abs(u)*2-.5)),on:true})}
  var seg=1;
  for(var d=0;d<=tot;d+=1.15){
    while(seg<pts.length-1&&L[seg]<d)seg++;
    var p0=pts[seg-1],p1=pts[seg],sl=(L[seg]-L[seg-1])||1,f=(d-L[seg-1])/sl;
    var x=p0[0]+(p1[0]-p0[0])*f,y=p0[1]+(p1[1]-p0[1])*f,nx=-(p1[1]-p0[1])/sl,ny=(p1[0]-p0[0])/sl;
    var t=d/tot,w=wf(t);if(w<=.05)continue;
    var r=Math.max(.5,Math.min(1.7,w/nb*.98));
    for(i=0;i<nb;i++){var b=br[i];
      if(dry){if(b.on){if(rnd()<dry*.022*(.4+2*t))b.on=false}else if(rnd()<.24)b.on=true;if(!b.on)continue}
      P.ops.push({k:0,x:x+nx*b.u*w+(rnd()-.5)*.4,y:y+ny*b.u*w+(rnd()-.5)*.4,r:r,a:Math.min(1,a*b.ink),c:c});
    }
  }
}
function dot(P,x,y,r,a,c){P.ops.push({k:0,x:x,y:y,r:r,a:a,c:c||INK})}
function wash(P,x,y,r,a,c,sx,er){P.ops.push({k:2,x:x,y:y,r:r,a:a,c:c||INK,sx:sx||1,er:!!er})}
function leaf(P,x,y,ang,len,w,o){
  var ex=x+Math.cos(ang)*len,ey=y+Math.sin(ang)*len,b=len*(P.rnd()-.5)*.24;
  var mx=(x+ex)/2-Math.sin(ang)*b,my=(y+ey)/2+Math.cos(ang)*b;
  stroke(P,qb([x,y],[mx,my],[ex,ey],10),function(t){return w*Math.sin(PI*Math.pow(t,.55))},o);
}

/* ---------- things the brush knows ---------- */
var G={};

G.bamboo=function(P,ax,ay){
  var W=P.W,H=P.H,S=P.S,rnd=P.rnd,R=P.R;
  var x0=ax==null?R(.18,.82)*W:ax,n=2+(rnd()<.5?1:0);
  function cluster(x,y,dir,light){
    var k=3+Math.floor(rnd()*3);
    for(var i=0;i<k;i++)leaf(P,x,y,PI/2-dir*R(-.25,1),R(34,68)*S,R(7,12)*S,{a:light?R(.2,.32):R(.72,.92)});
  }
  for(var s=0;s<n;s++){
    var x=x0+(s-(n-1)/2)*R(26,46)*S,y=H+8,top=(ay==null?R(.1,.3)*H:ay)+R(-20,45)*S*(s?1:0);
    var w=R(9,15)*S,lean=R(-.1,.1),seg=R(60,85)*S,dark=s===0?R(.3,.42):R(.14,.24),nodes=[];
    while(y>top+4){
      var y1=Math.max(top,y-seg),x1=x+lean*(y-y1),ww=w;
      stroke(P,[[x,y],[(x+x1)/2+R(-1,1),(y+y1)/2],[x1,y1]],function(t){return ww*(1+.09*Math.cos(t*TAU))},{a:dark,edge:.9,dry:.25});
      stroke(P,qb([x1-w*.62,y1-1*S],[x1,y1-3.4*S],[x1+w*.62,y1-1*S],6),function(t){return 2.4*S*(.45+.55*Math.sin(PI*t))},{a:.78});
      nodes.push([x1,y1-2*S]);
      y=y1-3.6*S;x=x1;w*=.94;lean+=R(-.03,.03);seg*=1.04;
    }
    for(var i=Math.floor(nodes.length*.3);i<nodes.length;i++){
      if(i<nodes.length-1&&rnd()>.65)continue;
      var nd=nodes[i],dir=rnd()<.5?-1:1,ang=-PI/2+dir*R(.5,1.05),len=R(35,80)*S;
      var ex=nd[0]+Math.cos(ang)*len,ey=nd[1]+Math.sin(ang)*len;
      var bp=qb(nd,[(nd[0]+ex)/2,(nd[1]+ey)/2+R(2,9)*S],[ex,ey],8);
      stroke(P,bp,function(t){return 1.7*S*(1-.5*t)},{a:.6});
      if(rnd()<.5)cluster(bp[4][0],bp[4][1],dir,true);
      cluster(ex,ey,dir,s>0&&rnd()<.3);
    }
  }
};

G.mountain=function(P,ax,ay){
  var W=P.W,H=P.H,S=P.S,rnd=P.rnd,R=P.R;
  var cx=ax==null?R(.25,.75)*W:ax,top=ay==null?R(.2,.42)*H:ay,base=Math.min(H*.94,top+R(.3,.42)*H);
  for(var i=0;i<3;i++){
    var f=i/2,a=[.16,.3,.5][i],lt=top+(base-top)*f*.5,lb=base+f*16*S,peaks=[],np=2+(rnd()<.5?1:0);
    peaks.push({x:cx+(i?R(-.28,.28)*W:0),h:lb-lt,hw:R(.2,.32)*W});
    for(var p=1;p<np;p++)peaks.push({x:peaks[0].x+R(.12,.34)*W*(rnd()<.5?-1:1),h:(lb-lt)*R(.45,.8),hw:R(.14,.26)*W});
    var x0=1e9,x1=-1e9;peaks.forEach(function(q){x0=Math.min(x0,q.x-q.hw);x1=Math.max(x1,q.x+q.hw)});
    var ph=[R(0,TAU),R(0,TAU),R(0,TAU)],pts=[],minY=lb;
    for(var x=x0;x<=x1;x+=5*S){
      var e=0;peaks.forEach(function(q){var d=Math.abs(x-q.x)/q.hw;if(d<1)e=Math.max(e,q.h*Math.pow(1-d,1.25))});
      var y=lb-e*(1+.09*Math.sin(x*.045/S+ph[0])+.05*Math.sin(x*.12/S+ph[1])+.03*Math.sin(x*.3/S+ph[2]))+R(-1.5,1.5)*S;
      pts.push([x,y]);minY=Math.min(minY,y);
    }
    P.ops.push({k:1,pts:pts.concat([[x1,lb+2],[x0,lb+2]]),y0:minY,y1:lb,a:a*.8,c:INK});
    (function(f,a){stroke(P,pts,function(t){return (1.6+3*f)*S*Math.pow(Math.sin(PI*t),.4)+.3},{a:Math.min(.9,a+.18),dry:.5})})(f,a);
    if(i){var nt=5+Math.floor(rnd()*5);
      for(var k=0;k<nt;k++){
        var q=pts[Math.floor(R(.2,.8)*pts.length)],pk=peaks[0];
        peaks.forEach(function(z){if(Math.abs(z.x-q[0])<Math.abs(pk.x-q[0]))pk=z});
        var dir=q[0]<pk.x?-1:1,ey=Math.min(lb-4,q[1]+R(22,70)*S);if(ey<q[1]+8)continue;
        stroke(P,[[q[0],q[1]+2],[q[0]+dir*R(8,28)*S,ey]],function(t){return 3.2*S*(1-t)+.4},{a:a*.6,dry:.9});
      }
    }
  }
};

G.moon=function(P,ax,ay){
  var R=P.R,x=ax==null?R(.2,.8)*P.W:ax,y=ay==null?R(.12,.3)*P.H:ay;
  P.ops.push({k:4,x:x,y:y,r:R(28,44)*P.S,a:.26,c:INK});
};

G.sun=function(P,ax,ay){
  var R=P.R,S=P.S,x=ax==null?R(.2,.8)*P.W:ax,y=ay==null?R(.12,.3)*P.H:ay,r=R(22,34)*S;
  wash(P,x,y,r*2.4,.16,RED);
  dot(P,x,y,r,.82,RED);
  for(var i=0;i<26;i++){var a=R(0,TAU);dot(P,x+Math.cos(a)*r*.96,y+Math.sin(a)*r*.96,R(1.5,4)*S,.5,RED)}
};

G.bird=function(P,ax,ay){
  var R=P.R,S=P.S,rnd=P.rnd,W=P.W,t=P.t,cx=ax==null?R(.25,.75)*W:ax,cy=ay==null?R(.1,.35)*P.H:ay,n=3+Math.floor(rnd()*5),side=rnd()<.5?-1:1;
  var m=60*S,span=W+2*m,sp=R(14,22)*S;
  for(var i=0;i<n;i++){
    var row=Math.ceil(i/2),sd=i%2?1:-1,s=R(13,20)*S*(1-row*.07),fp=R(0,TAU),fs=R(5,7),k1=R(.9,1.2),k2=R(.55,.9);
    var x=cx+side*row*R(28,40)*S-side*sp*t,y=cy+sd*row*R(15,24)*S+R(-4,4)*S+Math.sin(t*.7+fp)*3*S;
    x=((x+m)%span+span)%span-m;
    var fl=Math.sin(t*fs+fp);
    for(var w=-1;w<=1;w+=2){
      var tip=[x+w*s*k1*(1-.12*fl),y-s*(.25+.5*fl)];
      stroke(P,qb([x,y],[x+w*s*.45,y-s*(k2*.6+.35*fl)],tip,8),function(q){return 3*S*(1-q)+.5},{a:.8});
    }
    dot(P,x-side*1.5*S,y+.5*S,1.5*S,.85);
  }
};

G.fish=function(P,ax,ay){
  var R=P.R,S=P.S,rnd=P.rnd,t=P.t,cx=ax==null?R(.25,.75)*P.W:ax,cy=ay==null?R(.6,.85)*P.H:ay,n=1+(rnd()<.65?1:0);
  for(var i=0;i<n;i++){
    var rad=R(30,58)*S,sp=R(.22,.4)*(rnd()<.5?-1:1),ph=R(0,TAU),L=R(60,95)*S,wb=R(0,TAU),ox=i*R(20,40)*S*(rnd()<.5?-1:1),oy=i*R(14,26)*S;
    var c=i?INK:KOI,a=i?.5:.62,f=ph+t*sp,sg=sp<0?-1:1;
    var x=cx+ox+Math.cos(f)*rad*1.5,y=cy+oy+Math.sin(f)*rad*.8,th=Math.atan2(Math.cos(f)*.8*sg,-Math.sin(f)*1.5*sg);
    P.stir.push([x,y,Math.cos(th)*55*S,Math.sin(th)*55*S,20*S]);
    var wag=Math.sin(t*3.4+wb),b=L*(.11*wag-.13*sg);
    var tx=x-Math.cos(th)*L,ty=y-Math.sin(th)*L,mx=(x+tx)/2-Math.sin(th)*b,my=(y+ty)/2+Math.cos(th)*b;
    var sp2=qb([x,y],[mx,my],[tx,ty],14),tb=Math.atan2(ty-my,tx-mx)+.3*Math.sin(t*3.4+wb-1);
    leaf(P,sp2[4][0],sp2[4][1],th+PI-1.25-.15*wag,L*.27,L*.1,{a:a*.6,c:c});
    leaf(P,sp2[4][0],sp2[4][1],th+PI+1.25-.15*wag,L*.27,L*.1,{a:a*.6,c:c});
    (function(L){stroke(P,sp2,function(q){return L*.3*Math.pow(Math.sin(PI*Math.pow(q*.96+.02,.5)),.9)+.6},{a:a,c:c,edge:.3})})(L);
    leaf(P,tx,ty,tb+.5,L*.38,L*.13,{a:a*.75,c:c});
    leaf(P,tx,ty,tb-.5,L*.38,L*.13,{a:a*.75,c:c});
    if(!i)for(var k=0;k<3;k++){var q=sp2[3+k*3];wash(P,q[0]+R(-3,3)*S,q[1]+R(-3,3)*S,R(4,7)*S,.5,INK)}
    var ex=-Math.sin(th)*L*.07,ey=Math.cos(th)*L*.07;
    dot(P,sp2[1][0]+ex,sp2[1][1]+ey,1.5*S,.9);dot(P,sp2[1][0]-ex,sp2[1][1]-ey,1.5*S,.9);
  }
};

G.pine=function(P,ax,ay){
  var R=P.R,S=P.S,rnd=P.rnd,H=P.H,x0=ax==null?R(.2,.8)*P.W:ax,top=ay==null?R(.2,.4)*H:ay,by=H+6,hg=by-top,w0=R(16,24)*S;
  function needles(x,y){
    wash(P,x,y-6*S,26*S,.1,INK,1.4);
    var n=10+Math.floor(rnd()*6);
    for(var i=0;i<n;i++){var a=-PI/2+R(-1.3,1.3),l=R(13,24)*S;
      stroke(P,[[x,y],[x+Math.cos(a)*l,y+Math.sin(a)*l]],function(t){return 1.5*S*(1-.6*t)},{a:R(.55,.85)})}
  }
  var k=6,pts=[[x0,by]],x=x0,dr=R(-.22,.22),i;
  for(i=1;i<=k;i++){x+=(i%2?1:-1)*R(8,22)*S+dr*hg/k;pts.push([x,by-hg*i/k])}
  stroke(P,chaikin(pts,2),function(t){return w0*(1-.68*t)+1},{a:.6,dry:.8,edge:.8});
  for(i=0;i<14;i++){var q=pts[1+Math.floor(rnd()*3)];dot(P,q[0]+R(-.4,.4)*w0,q[1]+R(-30,30)*S,R(.8,1.8)*S,.7)}
  for(i=2;i<=k;i++){
    var b=pts[i],dir=i%2?1:-1,len=R(55,120)*S*(1.15-i/k*.5),ang=dir>0?R(-.35,.1):PI+R(-.1,.35);
    var ex=b[0]+Math.cos(ang)*len,ey=b[1]+Math.sin(ang)*len;
    var bp=qb(b,[(b[0]+ex)/2,(b[1]+ey)/2-R(4,14)*S],[ex,ey],10);

function drawPaper(){

function drawOp(c,o,ga){

  if(bleed&&F.ok)for(var b=0;b<1;b++){
    var o=el.ops[s0+Math.floor(Math.random()*(e-s0))];
    if(o&&o.k===0&&o.c!==SNOW)F.splat(o.x,o.y,(Math.random()-.5)*40*S,(Math.random()-.5)*40*S,absOf(o.c,.06*o.a),Math.max(6*S,o.r*3));

function build(el,instant){
  if(LIVE[el.kind]){el.spr=null;return}
  var P=gen(el,0),x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,i,j,o,rx;
  el.ops=P.ops;el.ang=P.ang;

    if(o.k===1){for(j=0;j<o.pts.length;j++){x0=Math.min(x0,o.pts[j][0]);x1=Math.max(x1,o.pts[j][0]);y0=Math.min(y0,o.pts[j][1]);y1=Math.max(y1,o.pts[j][1])}continue}
    rx=o.r*(o.sx||1);
    x0=Math.min(x0,o.x-rx);x1=Math.max(x1,o.x+rx);y0=Math.min(y0,o.y-o.r);y1=Math.max(y1,o.y+o.r);
  }
  if(el.kind==='rain'){x0=-W*.5;x1=W*1.5;y0=0;y1=H}
  if(el.kind==='ai'){x0=el.cx-el.B*.62;x1=el.cx+el.B*.62;y0=el.cy-el.B*.62;y1=el.cy+el.B*.62}
  x0=Math.max(Math.floor(x0)-3,-Math.ceil(W*.5)-10);x1=Math.min(Math.ceil(x1)+3,Math.ceil(W*1.5)+10);
  y0=Math.max(Math.floor(y0)-3,-40);y1=Math.min(Math.ceil(y1)+3,Math.ceil(H)+20);

function drawSpr(el,T,gust){

function frame(ms){
  requestAnimationFrame(frame);
  if(!W)return;
  var now=ms/1000,T=still?0:now,dt=Math.min(.034,Math.max(.008,now-lastT)),i,j,windy=false;lastT=now;
  while(queue.length&&queue[0].at<=now)queue.shift().fn();
  for(j=0;j<els.length;j++)if(els[j].kind==='wind')windy=true;
  var gust=(.6+.4*Math.sin(T*.21)*Math.sin(T*.083+1))*(windy?2.1:1);
  ink.setTransform(dpr,0,0,dpr,0,0);ink.globalAlpha=1;ink.clearRect(0,0,W,H);
  for(j=0;j<els.length;j++){
    var el=els[j],age=now-el.born;
    if(age<0)continue;
    if(F.ok&&FX[el.kind])FX[el.kind](el,T,dt,now);
    if(LIVE[el.kind]){
      var P=gen(el,T,now),ops=P.ops,ga=still?1:Math.min(1,age/1.4);
      curC=null;for(i=0;i<ops.length;i++)drawOp(ink,ops[i],ga);curC=null;ink.globalAlpha=1;
      if(F.ok)for(i=0;i<P.stir.length;i++){var s=P.stir[i];var sd=s[5]?s[5]*dt*60:0;F.splat(s[0],s[1],s[2],s[3],sd?[sd,sd,sd]:null,s[4])}
      continue;
    }
    if(el.i<el.ops.length)advance(el,still?1e9:Math.max(30,Math.ceil(el.ops.length/110)),!still);
    if(el.kind==='rain'){
      var k=Math.cos(el.ang)/Math.sin(el.ang),oy=(T*240*S)%H,ox=oy*k;
      ink.globalAlpha=still?1:Math.min(1,age/1.5);
      ink.drawImage(el.spr,el.bx+ox,oy,el.bw,el.bh);ink.drawImage(el.spr,el.bx+ox-H*k,oy-H,el.bw,el.bh);
      ink.globalAlpha=1;continue;
    }
    if((el.kind==='boat'||el.float)&&!still){
      ink.save();
      ink.translate(el.bx+el.bw/2+12*S*Math.sin(T*.09+el.seed%7),el.by+el.bh/2+1.6*S*Math.sin(T*1.3));
      ink.rotate(.028*Math.sin(T*1.1));ink.drawImage(el.spr,-el.bw/2,-el.bh/2,el.bw,el.bh);ink.restore();
    }else drawSpr(el,T,gust);
  }
  if(F.ok)for(i=0;i<AI.pending.length;i++){var pd=AI.pending[i];if(now>pd.next){pd.next=now+.7;F.vortex(pd.x,pd.y,(pd.k++%2?1:-1)*42,70*S);F.splat(pd.x,pd.y,0,0,[.045,.045,.045],20*S)}}
  var fl=Math.max(0,1-(now-flashT)/.4);flash.style.opacity=fl>0?(.6*fl*fl).toFixed(3):0;
  if(F.ok){
    if(Math.random()<.03)F.splat(Math.random()*W,Math.random()*H,(Math.random()-.5)*70*S,(Math.random()-.5)*50*S,null,(120+Math.random()*80)*S);
    F.step(dt);F.render();
  }
}

function dropGlyph(text,x,y,col){

  var cjk=/[⺀-鿿]/.test(text),fs=cjk?Math.min(104*S,W*.8/text.length):Math.min(64*S,W*1.5/text.length);

function aiPrompt(w){
  return 'You are an ink-wash (sumi-e) painter. Paint "'+w+'" as a small, instantly recognisable brush painting for a school open day.\n\n'
  +'Canvas: 100 x 100 units, x to the right, y DOWN. Keep the subject within 8..92 and make it fill most of that area.\n\n'
  +'Reply with ONLY compact JSON objects, one per line, no other text, no code fence.\n'
  +'Line 1: {"zh":"<Traditional Chinese name, at most 4 characters>","motion":"sway"|"float"|"none"}  (sway = plants and things that bend in wind; float = things that hover, fly or drift on water; none = everything else)\n'
  +'Then 14 to 34 lines, painted back to front (pale washes first, bold shapes next, small dark details last). Each line is one of:\n'
  +'{"p":[[x,y],[x,y],...],"w":4,"c":"black","t":"both"}  a brush stroke through 2-9 points; it is smoothed into a curve, add "sharp":true to keep corners. w = width in canvas units, 0.6 (hairline) to 10 (very broad). t = taper: "both" (thin-fat-thin), "end" (fat to thin), "start" (thin to fat), "none".\n'
  +'{"wash":[x,y,r],"c":"pale"}  a soft blot of diluted ink with radius r\n'
  +'{"dot":[x,y,r],"c":"black"}  a solid dot\n'
  +'Colours: black, grey, pale, red, orange, pink, green, blue, yellow, brown. Mostly black and grey, with at most two accent colours.\n\n'
  +'Rules: build solid forms from a few broad strokes (w 5-10) rather than thin outlines; get the silhouette and proportions right first; no letters, numbers or text; integer coordinates are fine.\n'
  +'If "'+w+'" cannot be painted, or is not suitable for children, reply with the single line {"no":1}.\n\n'
  +'Example for "mug":\n{"zh":"杯子","motion":"none"}\n{"wash":[48,60,30],"c":"pale"}\n{"p":[[30,35],[32,80],[66,80],[68,35]],"w":7,"c":"black","t":"none","sharp":true}\n{"p":[[68,45],[86,48],[84,68],[67,70]],"w":4,"c":"black","t":"both"}\n{"p":[[30,35],[49,31],[68,35]],"w":3,"c":"grey","t":"both"}\n{"p":[[44,24],[40,16],[46,9]],"w":1.5,"c":"pale","t":"end"}';
}
function mkP(seed){var r=rng(seed);return {W:W,H:H,S:S,t:0,now:0,rnd:r,ops:[],stir:[],R:function(a,b){return a+(b-a)*r()}}}
function aiBox(el){
  el.B=Math.min(300*S,W*.72,H*.55);
  el.cx=Math.min(Math.max(el.ax*W,el.B*.62),W-el.B*.62);el.cy=Math.min(Math.max(el.ay*H,el.B*.62+40),H-el.B*.62-70);
}
function num(v,lo,hi,d){v=+v;if(!(v===v))v=d;return Math.min(hi,Math.max(lo,v))}
/* one shape from Claude -> brush ops, appended to out */
function shapeOps(el,sh,idx,out){
  var P=mkP(el.seed+idx*7919),u=el.B/100,col=AICOL[sh.c]||AICOL.black,i;
  function X(v){return el.cx+(num(v,-8,108,50)-50)*u}function Y(v){return el.cy+(num(v,-8,108,50)-50)*u}
  if(Array.isArray(sh.wash))wash(P,X(sh.wash[0]),Y(sh.wash[1]),num(sh.wash[2],2,55,15)*u,Math.min(.4,col[1]*.6),col[0],1);
  else if(Array.isArray(sh.dot))dot(P,X(sh.dot[0]),Y(sh.dot[1]),num(sh.dot[2],.3,12,1.5)*u,col[1],col[0]);
  else if(Array.isArray(sh.p)){
    var pts=[];for(i=0;i<sh.p.length&&i<24;i++)if(Array.isArray(sh.p[i]))pts.push([X(sh.p[i][0]),Y(sh.p[i][1])]);
    if(pts.length<2)return;
    if(pts.length>2&&!sh.sharp)pts=chaikin(pts,2);
    var w=num(sh.w,.4,14,3)*u,t=sh.t,wf=t==='none'?function(){return w}:t==='end'?function(q){return w*(1-.85*q)+.4}:t==='start'?function(q){return w*(.15+.85*q)+.4}:function(q){return w*(.25+.75*Math.sin(PI*q))};
    stroke(P,pts,wf,{a:col[1],c:col[0],dry:w>5*u?.3:0,edge:w>4*u?.4:0});
  }
  for(i=0;i<P.ops.length;i++)out.push(P.ops[i]);
}
G.ai=function(P){var el=P.el;aiBox(el);for(var i=0;i<el.shapes.length;i++)shapeOps(el,el.shapes[i],i,P.ops)};

  rate_limited:'墨用得太快了，等一下再試。',session_expired:'請重新登入 Claude 再試。',refused:'這個字，墨不畫。'};
function aiPaint(word,ax,ay,delay){
  var now=performance.now()/1000,el={kind:'ai',word:word,seed:(Math.random()*2147483647)|0,ax:ax,ay:ay,i:0,ops:[],shapes:[],lastK:-1,born:now+delay+.9};

  say('墨正在想「'+word+'」怎麼畫…',true);

  var opts={onText:function(u){buf+=u.delta;var parts=buf.split('\n');buf=parts.pop();parts.forEach(line)}},mo=MODELS[AI.model].opts;
  for(var k in mo)opts[k]=mo[k];

    AI.last='上次：「'+word+'」'+secs+' 秒，'+(res&&res.modelApplied?res.modelApplied:'層級 '+(res&&res.modelTierApplied||'?'))+'，'+el.shapes.length+' 筆';aiPanel();

}

function paint(text){
  /* split on punctuation into phrases; a phrase made only of bank words paints each word, anything else goes to the AI as one phrase */
  var items=[],unknown=[];
  String(text).toLowerCase().split(/[,，、。;；\n]+/).forEach(function(ph){
    ph=ph.replace(/["\\<>{}]/g,'').trim();if(!ph)return;
    var toks=ph.split(/\s+/),kinds=toks.map(lookup);
    if(kinds.every(Boolean))toks.forEach(function(w,i){items.push({w:w,kind:kinds[i]})});
    else if(AI.on)items.push({w:ph.slice(0,30),kind:null});
    else toks.forEach(function(w,i){items.push({w:w.slice(0,16),kind:kinds[i]})});
  });
  items=items.slice(0,6);
  if(!items.length)return;
  if(!W)resize();
  used=true;
  items.forEach(function(it,n){
    var w=it.w,kind=it.kind,d=DEF[kind||'none'],ax,ay;
    if(anchor&&n===0){ax=anchor.x;ay=anchor.y}else{ax=d[0]+Math.random()*(d[1]-d[0]);ay=d[2]+Math.random()*(d[3]-d[2])}
    var delay=n*1.1,gx=ax*W,gy=ay*H,glyph=kind?BANK[kind][0]:w,col=GCOL[kind];
    if(kind==='rain'||kind==='snow'||kind==='wind'){gx=W*(.3+Math.random()*.4);gy=H*.32}
    if(!kind&&AI.on){var ael=aiPaint(w,ax,ay,delay);if(!ael)return;gx=ael.cx;gy=ael.cy}
    else if(!kind)unknown.push(w);
    function drop(){dropGlyph(glyph,gx,gy,col)}
    if(F.ok){
      var go=function(){if(delay){queue.push({at:performance.now()/1000+delay,fn:drop});queue.sort(function(a,b){return a.at-b.at})}else drop()};
      if(document.fonts&&document.fonts.load)Promise.race([Promise.all([document.fonts.load('80px "Ma Shan Zheng"',glyph),document.fonts.load('80px "LXGW WenKai TC"',glyph)]),new Promise(function(r){setTimeout(r,1200)})]).then(go,go);else go();
    }
    if(!kind)return;
    var el={kind:kind,word:w,seed:(Math.random()*2147483647)|0,ax:ax,ay:ay,i:0,ops:[],lastK:-1,born:performance.now()/1000+delay+(F.ok?.9:0)};
    build(el,still);els.push(el);
  });
  anchor=null;pin.classList.remove('on');
  if(unknown.length)say(F.ok?'墨還不認識「'+unknown.join('、')+'」，只好隨水散去。':'墨還不認識「'+unknown.join('、')+'」。');
  sync();
}

document.getElementById('f').addEventListener('submit',function(e){
  e.preventDefault();paint(q.value);q.value='';
  if(window.matchMedia&&matchMedia('(pointer:coarse)').matches)q.blur();
});
var coarse=window.matchMedia&&matchMedia('(pointer:coarse)').matches;
q.addEventListener('focus',function(){if(coarse)bottom.classList.add('typing')});
q.addEventListener('blur',function(){bottom.classList.remove('typing')});
document.addEventListener('keydown',function(e){
  if(document.activeElement!==q&&e.key&&e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/\S/.test(e.key))q.focus();
});
var chips=document.getElementById('chips');
Object.keys(BANK).forEach(function(k){
  var b=document.createElement('button');b.type='button';b.className='chip';
  var c=document.createElement('b');c.textContent=BANK[k][0];var l=document.createElement('i');l.textContent=k;
  b.appendChild(c);b.appendChild(l);b.addEventListener('click',function(){paint(k)});chips.appendChild(b);
});
undoB.addEventListener('click',function(){els.pop();sync()});
clearB.addEventListener('click',function(){els=[];queue=[];F.clear();sync()});
/* tap the seal three times to open the AI settings */
var markTaps=[];
document.getElementById('mark').addEventListener('click',function(){
  var n=performance.now();markTaps=markTaps.filter(function(x){return n-x<900});markTaps.push(n);
  if(markTaps.length>=3){markTaps=[];var p=document.getElementById('panel');p.hidden=!p.hidden;aiPanel()}
});
if(!app.requestFullscreen||!document.fullscreenEnabled)fullB.style.display='none';
fullB.addEventListener('click',function(){
  try{var p=document.fullscreenElement?document.exitFullscreen():app.requestFullscreen();if(p&&p.catch)p.catch(function(){say('這裡無法使用全螢幕。')})}
  catch(err){say('這裡無法使用全螢幕。')}
});
document.addEventListener('fullscreenchange',function(){fullB.textContent=document.fullscreenElement?'退出全螢幕':'全螢幕'});

/* fingers: tap to choose a spot, drag to stir the ink */
var ptr={};
function pos(e){var b=stage.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]}
stage.addEventListener('pointerdown',function(e){
  var p=pos(e);ptr[e.pointerId]={x:p[0],y:p[1],x0:p[0],y0:p[1],moved:false,t:performance.now()};
  try{stage.setPointerCapture(e.pointerId)}catch(err){}
});
stage.addEventListener('pointermove',function(e){
  var s=ptr[e.pointerId];if(!s)return;
  var p=pos(e),dx=p[0]-s.x,dy=p[1]-s.y,now=performance.now(),dt=Math.max(8,now-s.t)/1000;
  if(Math.hypot(p[0]-s.x0,p[1]-s.y0)>10)s.moved=true;
  if(s.moved&&(dx||dy)){
    var a=Math.min(.09,.02+Math.hypot(dx,dy)*.004);
    F.splat(p[0],p[1],Math.max(-1500,Math.min(1500,dx/dt*.7)),Math.max(-1500,Math.min(1500,dy/dt*.7)),[a,a,a],15*S);
    if(!used){used=true;sync()}
  }
  s.x=p[0];s.y=p[1];s.t=now;
});
function up(e){
  var s=ptr[e.pointerId];if(!s)return;delete ptr[e.pointerId];
  if(!s.moved){anchor={x:s.x/W,y:s.y/H};pin.style.left=s.x+'px';pin.style.top=s.y+'px';pin.classList.add('on')}
}
stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',function(e){delete ptr[e.pointerId]});
fluidC.addEventListener('webglcontextlost',function(e){e.preventDefault();F.ok=false;fluidC.style.display='none'});

var rt=0;
window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(resize,120)});
if(window.ResizeObserver)new ResizeObserver(function(){clearTimeout(rt);rt=setTimeout(resize,120)}).observe(stage);
if(document.fonts&&document.fonts.load)document.fonts.load('80px "LXGW WenKai TC"','墨山月竹魚鳥龍風霧').catch(function(){});
resize();sync();requestAnimationFrame(frame);
/* inside Claude, the page can ask Claude to paint words that are not in the bank */
if(window.claude&&typeof window.claude.use==='function'){try{window.claude.use('sample').then(function(s){if(typeof s==='function'){AI.fn=s;AI.on=true;aiUI();aiPanel()}},function(){})}catch(e){}}
window.__ink={paint:paint,els:function(){return els},fluid:function(){return F.ok},ai:function(){return AI}};
})();

</script>
