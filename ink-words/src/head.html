<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨語 Ink Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=LXGW+WenKai+TC&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f2ebdb; --ink:#231f1b; --ink-soft:#6b6257; --line:rgba(35,31,27,.24); --seal:#b23a2e; --glass:rgba(244,238,224,.72)}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden}
  body{background:var(--paper); color:var(--ink); font-family:"Cormorant Garamond","LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","Songti TC",Georgia,serif; font-size:18px; -webkit-tap-highlight-color:transparent}
  #app{position:fixed; inset:0; background:var(--paper); overflow:hidden}
  #stage{position:absolute; inset:0; touch-action:none; cursor:crosshair}
  #stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block}
  #flash{position:absolute; inset:0; background:#fffdf4; opacity:0; pointer-events:none}
  #hint{position:absolute; left:0; right:0; top:38%; text-align:center; padding:0 24px; color:var(--ink-soft); font-size:clamp(19px,2.4vw,30px); line-height:1.5; pointer-events:none; transition:opacity .8s}
  #hint.off{opacity:0}
  #pin{position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%; border:1.5px solid var(--seal); pointer-events:none; opacity:0; transition:opacity .25s}
  #pin.on{opacity:.85}
  .top{position:absolute; top:12px; left:14px; right:14px; display:flex; align-items:center; gap:10px; pointer-events:none}
  .top>*{pointer-events:auto}
  .mark{border:0; padding:0; cursor:pointer; font-family:"Ma Shan Zheng","Kaiti SC",STKaiti,serif; font-size:24px; line-height:1; background:var(--seal); color:var(--paper); width:38px; height:38px; border-radius:5px; display:grid; place-items:center; flex:none}
  h1{font-size:23px; font-weight:600; margin:0; letter-spacing:.12em; flex:1; white-space:nowrap; pointer-events:none}
  .ghost{white-space:nowrap; font:inherit; font-size:16px; color:var(--ink); background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:6px 14px; min-height:40px; cursor:pointer}
  .ghost:active{background:rgba(35,31,27,.12)}
  .ghost:disabled{opacity:.4; cursor:default}
  .bottom{position:absolute; left:0; right:0; bottom:10px; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none}
  .bottom.typing{bottom:auto; top:60px}
  .bottom>*{pointer-events:auto}
  form{display:flex; gap:8px; width:min(440px,calc(100% - 28px))}
  input{flex:1; min-width:0; font:inherit; font-size:19px; color:var(--ink); background:var(--glass); border:1px solid var(--line); border-radius:999px; padding:9px 18px; outline:none}
  input::placeholder{color:var(--ink-soft)}
  input:focus{border-color:var(--ink)}
  .paint{font:inherit; font-weight:600; font-size:18px; color:var(--paper); background:var(--ink); border:0; border-radius:999px; padding:0 22px; min-height:44px; cursor:pointer}
  .paint:active{transform:translateY(1px)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--seal); outline-offset:2px}
  .chips{display:flex; gap:4px; max-width:100%; overflow-x:auto; padding:2px 12px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none; display:flex; flex-direction:column; align-items:center; gap:1px; min-width:46px; padding:5px 4px 4px; font:inherit; color:var(--ink); background:var(--glass); border:1px solid var(--line); border-radius:10px; cursor:pointer}
  .chip b{font-family:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB",STKaiti,serif; font-weight:400; font-size:24px; line-height:1.05}
  .chip i{font-size:12px; color:var(--ink-soft); line-height:1.1}
  .chip:active{border-color:var(--seal); color:var(--seal)}
  #aibadge{font-size:13px; letter-spacing:.04em; font-weight:500; color:var(--seal); border:1px solid var(--seal); border-radius:999px; padding:1px 8px; margin-left:6px; vertical-align:middle}
  #panel{position:absolute; top:60px; left:14px; width:min(300px,calc(100% - 28px)); background:#f6f0e2; border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:0 8px 28px rgba(60,45,20,.22); font-size:17px}
  #panel p{margin:6px 0 8px; color:var(--ink-soft); font-size:15px; line-height:1.4}
  #panel label{display:block; padding:7px 0; cursor:pointer}
  #panel input{flex:none; width:18px; height:18px; padding:0; margin:0 4px 0 0; vertical-align:-3px; accent-color:var(--seal)}
  #panel .last{color:var(--ink); border-top:1px solid var(--line); padding-top:8px; margin-top:8px}
  #panel .row{display:flex; gap:8px; margin-top:8px}
  #toast{position:absolute; left:50%; top:64px; transform:translateX(-50%); max-width:calc(100% - 28px); background:var(--ink); color:var(--paper); font-size:16px; padding:8px 16px; border-radius:999px; opacity:0; transition:opacity .3s; pointer-events:none; text-align:center}
  #toast.on{opacity:.94}
  @media (max-width:520px){h1{font-size:18px}.ghost{padding:6px 11px;font-size:15px}#full{display:none}}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="paper" aria-hidden="true"></canvas>
    <canvas id="fluid" aria-hidden="true"></canvas>
    <canvas id="ink" role="img" aria-label="水墨畫布"></canvas>
    <div id="flash"></div>
    <div id="hint">輸入一個字，或點選下方的字，墨就會化成它。<br>在紙上拖動手指，可以攪動墨水。</div>
    <div id="pin"></div>
  </div>
  <div class="top">
    <button class="mark" id="mark" type="button" aria-label="連按三下開啟 AI 作畫設定">墨</button>
    <h1>墨語 <span id="aibadge" hidden>AI 作畫</span></h1>
    <button class="ghost" id="full" type="button">全螢幕</button>
    <button class="ghost" id="undo" type="button" disabled>復原</button>
    <button class="ghost" id="clear" type="button" disabled>清空</button>
  </div>
  <div id="panel" hidden></div>
  <div id="toast" role="status"></div>
  <div class="bottom" id="bottom">
    <form id="f" autocomplete="off">
      <input id="q" type="text" inputmode="text" enterkeyhint="go" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="輸入一個字… 竹、zhu、bamboo" aria-label="要畫的字">
      <button class="paint" type="submit">落墨</button>
    </form>
    <div class="chips" id="chips" aria-label="墨認識的字"></div>
  </div>
</div>
